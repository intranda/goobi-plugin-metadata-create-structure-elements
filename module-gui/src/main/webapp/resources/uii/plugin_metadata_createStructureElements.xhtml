<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:util="http://goobi.io/util">

    <composite:interface>
    </composite:interface>

    <composite:implementation>
        <!-- MODAL -->
        <h:panelGroup
            layout="block"
            id="creationModal"
            styleClass="modal fade"
            tabindex="-1"
            role="dialog"
            aria-labelledby="#creationModalContentTitle">
            <div
                class="modal-dialog"
                role="document">
                <h:panelGroup
                    id="creationModalContent"
                    layout="block"
                    styleClass="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h4 class="modal-title fs-5" id="creationModalContentTitle">#{msgs[Metadaten.extension.title]}</h4>
                        <button
                            type="button"
                            class="btn text-white"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                            <util:icon icon="x" />
                        </button>
                    </div>
                    <h:form
                        rendered="#{Metadaten.extension.title == 'intranda_metadata_createStructureElements'}">
                        <div class="modal-body p-0">
                            <div class="form-row">
                                <div class="form-label">
                                    <h:outputLabel
                                        for="type"
                                        styleClass="form-group__label"
                                        value="#{msgs.plugin_metadata_createElements_selectType}" />
                                </div>
                                <div class="form-input">
                                    <h:selectOneMenu
                                        id="type"
                                        styleClass="form-select"
                                        value="#{Metadaten.extension.selectedType}">
                                        <f:selectItem
                                            itemValue="null"
                                            itemLabel="#{msgs.bitteAuswaehlen}" />
                                        <f:selectItems
                                            value="#{Metadaten.extension.docTypeMap.entrySet()}"
                                            var="entry"
                                            itemValue="#{entry.key}"
                                            itemLabel="#{entry.key}" />
                                    </h:selectOneMenu>
                                </div>
                            </div>
                            <div class="form-row border-top">
                                <div class="form-label">
                                    <h:outputLabel
                                        for="numberOfImages"
                                        styleClass="form-group__label"
                                        value="#{msgs.plugin_metadata_createElements_numberOfImages}" />
                                </div>
                                <div class="form-input">
                                    <h:inputText
                                        id="numberOfImages"
                                        styleClass="form-control"
                                        value="#{Metadaten.extension.numberOfImages}" />
                                </div>
                            </div>
                            <div class="form-row border-top">
                                <div class="form-label">
                                    <h:outputLabel
                                        for="generateTitle"
                                        styleClass="form-group__label"
                                        value="#{msgs.plugin_metadata_createElements_generateTitle}" />
                                </div>
                                <div class="form-input">
                                    <h:selectBooleanCheckbox
                                        id="generateTitle"
                                        styleClass="form-check-input"
                                        value="#{Metadaten.extension.generateTitleFromFilename}" />
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-blank"
                                data-bs-dismiss="modal">#{msgs.abbrechen}</button>
                            <button
                                jsf:id="absenden"
                                class="btn btn-primary"
                                jsf:action="#{Metadaten.extension.generateElements}">
                                <span>#{msgs.plugin_metadata_createElements_generateElements}</span>
                            </button>
                        </div>
                    </h:form>
                </h:panelGroup>
            </div>
        </h:panelGroup>
    </composite:implementation>
</ui:composition>
